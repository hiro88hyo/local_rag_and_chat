[project]
name = "local-rag-and-chat"
version = "0.1.0"
description = "Add your description here"
dependencies = [
    "streamlit>=1.45.1",
    "langchain>=0.3.25",
    "langchain-community>=0.3.24",
    "litellm>=1.71.2",
    "chromadb>=1.0.11",
    "sentence-transformers>=4.1.0",
    "transformers>=4.52.3",
    "pypdf>=5.5.0",
    "unstructured>=0.17.2",
    "python-docx>=1.1.2",
    "sentencepiece>=0.2.0",
    "langchain-huggingface>=0.2.0",
    "protobuf~=3.20.0",
    "langchain-chroma>=0.2.4",
    "langchain-litellm>=0.2.1",
    "boto3>=1.38.27",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/local_rag_and_chat"]
